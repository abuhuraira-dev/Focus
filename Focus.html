toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:13px 23px;z-index:10}.barrow{display:grid;grid-template-columns:90px 1fr 40px;gap:15px;align-items:center;margin:18px 0}.empty{padding:24px;color:var(--muted);text-align:center}@media(min-width:1450px){main{padding:35px 60px}}@media(max-width:1100px){main{padding:25px}.grid{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr;gap:20px}.right>.sectionhead{display:none}.right .note{margin:0}.right>.card{margin-top:20px}.shell{grid-template-columns:195px 1fr}}@media(max-width:700px){.shell{display:block}aside{height:auto;position:static;padding:16px;border-right:0}.brand{font-size:24px}.tag,.sidecard,.profile{display:none}nav{display:flex;overflow:auto;margin-top:14px;gap:5px}nav button{white-space:nowrap;width:auto;font-size:12px;padding:10px}nav span{display:none}main{padding:20px 16px}header{align-items:start}.header-actions button{padding:8px;font-size:11px}.intro{margin-top:24px}h1{font-size:28px}.intro>.pill{display:none}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat strong{font-size:25px}.projectgrid,.right,.formgrid{display:block}.projectgrid>.card{margin-bottom:12px}.right>.card{margin-bottom:15px}.hero h2{font-size:24px}.bottom{line-height:1.8;gap:15px}.task{font-size:12px}.task>span{font-size:10px}.hero{padding:23px}}

/* Responsive controls: wrap within their own containers. */
main,.grid>*,.right,.card,.hero,header>*,.intro>*{min-width:0}
button{min-height:44px;line-height:1.35}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero .hero-actions button{margin:0;white-space:normal}
.sectionhead{flex-wrap:wrap;row-gap:8px}
.task label{min-width:0;overflow-wrap:anywhere}
.task>button{flex-shrink:0}
.projecttop{gap:10px;flex-wrap:wrap}
.header-actions{flex-wrap:wrap}
nav button[aria-current="page"]{background:var(--ink);color:#fff}
@media(max-width:700px){
 aside{padding:18px 16px 14px}
 nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;margin-top:18px}
 nav button{width:100%;min-width:0;margin:0;padding:10px 5px;white-space:normal;text-align:center;font-size:12px;line-height:1.35;min-height:44px;border-radius:9px}

 .crumb{line-height:1.5}
 .header-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .header-actions button{padding:11px 12px;font-size:12px;white-space:nowrap}
 .hero-actions{display:grid;grid-template-columns:1fr;gap:12px}
 .hero-actions button{width:100%;padding:13px 16px;text-align:center}
 .hero:after{font-size:200px;right:-25px;top:-15px;opacity:.55}
 .intro{align-items:flex-start;flex-wrap:wrap}
 .stat .eyebrow{font-size:9px;letter-spacing:1px;line-height:1.7}
 .stat small{line-height:1.5;display:block}
 .bottom{flex-direction:column;gap:5px}
 .timer{font-size:60px}
}

</style></head><body><div class="shell"><aside><div class="brand"><span class="mark">⌖</span>focus<span style="color:#82934e">.</span></div><div class="tag">YOUR DAILY WORKSPACE</div><nav id="nav"></nav><div class="sidecard"><span class="eyebrow">Priorities</span><p style="margin:8px 0">Income & Ausbildung</p><small>One business priority.<br>Two daily commitments.</small></div><div class="profile"><span class="avatar">S</span> Solo workspace <span class="pill">PERSONAL</span></div></aside><main><header><div class="crumb">Your workspace <span style="margin:0 9px">/</span> <strong id="crumb">Command center</strong></div><div class="header-actions"><button id="export">↥ Backup</button><button class="primary" id="checkin">＋ Daily check-in</button></div></header><div id="view"></div><div class="bottom"><span>FOCUS · SOLO AGENCY WORKSPACE</span><span>Saved on this browser · <button class="textbtn" id="settings">Data & settings</button></span></div></main></div><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s), day=()=>new Date().toLocaleDateString('en-CA'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={version:1,active:'Noblesoft',projects:[{name:'Noblesoft',desc:'Turn your freelance portfolio into paying client work.',color:'#e9eddf',obstacle:'Live portfolio, but no consistent outreach or clients.',tasks:['Define one service and a clear offer','Find 10 suitable prospects','Send 3 personalized outreach messages','Follow up with interested prospects','Book a discovery call','Deliver the first paid project']},{name:'FLASH',desc:'Make crypto trading easy and hassle free.',color:'#eee9fd',obstacle:'Almost ready; launch setup and customer acquisition remain.',tasks:['Buy a domain','Set up business email','Integrate a secondary payment gateway','Prepare a marketing plan','Complete launch readiness review','Launch']},{name:'Sprachly',desc:'Language learning for a career in Germany.',color:'#e6eefb',obstacle:'Curriculum updates, bugs, and distribution need attention.',tasks:['Update curriculum','Fix and verify bugs','Buy a domain','Set up business email','Prepare marketing','Establish affiliate partnerships','Complete launch readiness review','Launch']},{name:'Zyvro',desc:'Build a clothing brand people want to wear.',color:'#faecdf',obstacle:'Website gaps and product content are holding back launch.',tasks:['Update missing website features','Create product listings','Complete product shoot','Create ad creatives','Complete launch readiness review','Launch']}],done:{},plan:{},routines:{},checkins:[],ideas:[],sessions:[],reviews:[],german:45,it:60};
let state;try{state=JSON.parse(localStorage.getItem('focus-v1'))||structuredClone(seed)}catch{state=structuredClone(seed)}let page='Today',selected='Noblesoft',timer=null,remaining=1500,running=false,endAt=0;
state.clients ||= [];
const key=(p,i)=>p+'::'+i, project=n=>state.projects.find(p=>p.name===n), done=p=>p.tasks.filter((_,i)=>state.done[key(p.name,i)]).length;
function save(){try{localStorage.setItem('focus-v1',JSON.stringify(state))}catch{toast('Browser storage unavailable. Export a backup before leaving.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function modal(html){$('#modal').innerHTML='<div class="modalhead"><h2>'+html.title+'</h2><button data-close aria-label="Close dialog">×</button></div>'+html.body;$('#modal').showModal();$('#modal').querySelector('[data-close]').onclick=()=>$('#modal').close()}
function intro(title,sub,extra=''){return `<div class="intro"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}
function taskrow(p,i,mode='check'){const k=key(p.name,i);return `<div class="task ${state.done[k]?'done':''}"><input type="checkbox" aria-label="Complete ${esc(p.tasks[i])}" data-task="${esc(k)}" ${state.done[k]?'checked':''}><label data-detail="${esc(k)}">${esc(p.tasks[i])}<small>${esc(p.name)} · ${p.name===state.active?'Active priority':'Parked project'}</small></label>${mode==='add'?`<button class="textbtn" data-add="${esc(k)}">＋ Today</button>`:`<button class="textbtn" data-remove="${esc(k)}" aria-label="Remove from today">×</button>`}</div>`}
function nextTask(){let p=project(state.active);let i=p.tasks.findIndex((_,i)=>!state.done[key(p.name,i)]);return {p,i}}
function getPlan(){return state.plan[day()]||[]}
function projectcard(p){const n=done(p);return `<article class="card project"><div class="projecttop"><strong><span style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:${p.color};margin-right:9px">${p.name[0]}</span>${esc(p.name)}</strong><span class="pill" style="${p.name!==state.active?'background:#f1f1ed;color:#808276':''}">${p.name===state.active?'ACTIVE':'PARKED'}</span></div><p>${esc(p.desc)}</p><div class="progress"><i style="width:${n/p.tasks.length*100}%"></i></div><footer><span>${n} / ${p.tasks.length} milestones</span><button class="textbtn" data-project="${esc(p.name)}">Open project ↗</button></footer></article>`}
function render(){const tabs=[['Today','◫'],['Projects','▦'],['Clients','▣'],['Ausbildung','◎'],['Review','↗'],['Ideas','◇']];$('#nav').innerHTML=tabs.map(([n,i])=>`<button data-nav="${n}" aria-current="${page===n?'page':'false'}" class="${page===n?'active':''}"><span>${i}</span>${n==='Today'?'Today':n==='Ideas'?'Ideas':n==='Review'?'Performance':n}</button>`).join('');$('#crumb').textContent=page==='Today'?'Today':page;let html='';if(page==='Today')html=todayView();if(page==='Projects')html=projectsView();if(page==='Clients')html=clientsView();if(page==='Ausbildung')html=ausView();if(page==='Review')html=reviewView();if(page==='Ideas')html=ideasView();$('#view').innerHTML=html;bind()}
function todayView(){let {p,i}=nextTask(),plan=getPlan(),r=state.routines[day()]||{},n=plan.filter(k=>state.done[k]).length,checked=state.checkins.some(x=>x.date===day());return intro('Today','Choose up to three tasks. Start with your active project.',`<span class="pill">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</span>`)+`${clientAlert()}<div class="stats"><div class="stat"><span class="eyebrow">Today’s commitments</span><strong>${n}<span style="font-size:18px;color:#b1b5a8"> / ${plan.length}</span></strong><small>Up to 3 tasks</small></div><div class="stat"><span class="eyebrow">Deep work today</span><strong>${state.sessions.filter(s=>s.date===day()).reduce((a,s)=>a+s.minutes,0)} <span style="font-size:16px">min</span></strong><small>Focused sessions completed</small></div><div class="stat"><span class="eyebrow">Skills practiced</span><strong>${Number(!!r.german)+Number(!!r.it)}<span style="font-size:18px;color:#b1b5a8"> / 2</span></strong><small>German + IT, every day</small></div><div class="stat"><span class="eyebrow">Daily reflection</span><strong style="font-size:23px">${checked?'Checked in ✓':'Still to do'}</strong><small>${checked?'Progress recorded. Keep going.':'Check in at the end of your day'}</small></div></div><div class="grid"><div><div class="hero"><span class="eyebrow">↗ Next task · ${esc(p.name)}</span><h2>${i<0?'Your milestones are complete.':esc(p.tasks[i])}</h2><p>${i<0?'Review your results and choose the next measured step.':'Complete this task before switching projects.'}</p><div class="hero-actions"><button class="lime" data-focus>▶ Focus · 25 min</button>${i>=0?`<button data-add="${esc(key(p.name,i))}">＋ Add to today</button>`:''}</div></div><div class="sectionhead"><h2>Today’s commitments <span style="color:#929785;font-size:12px">${plan.length}/3</span></h2><button class="textbtn" data-nav="Projects">Choose tasks ↗</button></div><div class="card tasks">${plan.length?plan.map(k=>{let [name,index]=k.split('::');return taskrow(project(name),Number(index))}).join(''):'<div class="empty">No tasks selected.<br>Choose up to three from your projects.</div>'}</div><div class="sectionhead"><h2>Your project landscape</h2><button class="textbtn" data-nav="Projects">View all ↗</button></div><div class="projectgrid">${state.projects.map(projectcard).join('')}</div></div><div class="right"><div class="card"><div class="sectionhead" style="margin:0 0 8px"><h2>Daily foundations</h2><span class="pill">GERMANY</span></div><p class="sub" style="font-size:12px">German and IT practice</p>${routineRow('german','German language','DE',state.german)}${routineRow('it','IT skills practice','⌘',state.it)}<button style="width:100%;margin-top:14px" data-nav="Ausbildung">Open Ausbildung command ↗</button></div><div class="note"><span class="eyebrow">Ideas</span><h3 style="margin-top:10px">Save it for later.</h3><p>Capture ideas without changing today’s plan.</p><button class="textbtn" data-idea style="padding:12px 0 0;color:#4f6431">＋ Capture an idea</button></div><div class="card" style="margin-top:20px"><span class="eyebrow">Daily check-in</span><h2 style="margin-top:12px">Record your progress</h2><p class="sub" style="font-size:12px;margin:10px 0 15px">What finished? What’s blocked? What’s next?</p><button class="primary" data-checkin style="width:100%">${checked?'Update today’s check-in':'Do your daily check-in'} →</button></div></div></div>`}
function routineRow(k,title,icon,mins){let r=state.routines[day()]?.[k];return `<div class="routine"><div class="icon">${icon}</div><div class="body"><h3>${title}</h3><small>${r?`${r.minutes} min logged ✓`:`${mins} min suggested · daily`}</small></div><button data-routine="${k}">${r?'Update':'Log practice'}</button></div>`}
function projectsView(){let p=project(selected)||state.projects[0];return intro('Projects','One active project. All checklists in one place.')+`<div class="projectgrid">${state.projects.map(projectcard).join('')}</div><div class="sectionhead"><h2>${esc(p.name)} · Launch checklist</h2>${p.name!==state.active?`<button class="primary" data-activate="${esc(p.name)}">Make active priority</button>`:'<span class="pill">YOUR CURRENT PRIORITY</span>'}</div><div class="notice"><strong>Current obstacle:</strong> ${esc(p.obstacle)} <button class="textbtn" data-obstacle="${esc(p.name)}">Edit</button><br>Launch is a manual milestone: verify previous tasks and your product-specific obligations before marking it complete.</div><div class="card tasks" style="margin-top:15px">${p.tasks.map((_,i)=>taskrow(p,i,'add')).join('')}</div><button style="margin-top:15px" data-newtask="${esc(p.name)}">＋ Add milestone</button>`}
function ausView(){return intro('Ausbildung','German and IT preparation · 2026–2027')+`<div class="grid"><div class="stack"><div class="card"><span class="eyebrow">01 / LANGUAGE</span><h2 style="margin:12px 0">German language routine</h2><p class="sub">Suggested ${state.german} minutes: vocabulary, structured study, listening, and speaking.</p>${routineRow('german','German practice','DE',state.german)}<p class="notice">Try today: learn 10 career-related words, study one grammar topic, and record a two-minute self-introduction. Your required language level depends on the program.</p></div><div class="card"><span class="eyebrow">02 / CAREER EVIDENCE</span><h2 style="margin:12px 0">IT skills & portfolio routine</h2><p class="sub">Suggested ${state.it} minutes: practice one skill and leave visible evidence.</p>${routineRow('it','IT practice','⌘',state.it)}<p class="notice">Try today: build or improve one feature, commit the work, and document what you learned. Connect your practice to the Ausbildung role you want.</p></div></div><div class="card"><h2>Your preparation settings</h2><p class="sub" style="font-size:12px">These are planning targets, not confirmed application deadlines.</p><form id="routine-settings"><label class="field">German target · minutes / day<input name="german" type="number" min="5" max="480" value="${state.german}" required></label><label class="field">IT target · minutes / day<input name="it" type="number" min="5" max="480" value="${state.it}" required></label><button class="primary">Save targets</button></form><div class="note"><h3>Keep the destination clear</h3><p>Confirm your target role, current German level, employer requirements, application windows, and document checklist before setting a fixed deadline.</p></div></div></div>`}
function reviewView(){let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString('en-CA')});let logs=state.checkins.filter(x=>dates.includes(x.date));return intro('Performance','Review your practice, completed work, and check-ins.',`<button class="primary" data-weekly>Write weekly review</button>`)+`<div class="grid"><div class="card"><h2>Last 7 days · foundations</h2><p class="sub" style="font-size:12px">Days practiced, based on your saved logs.</p>${['german','it'].map(k=>{let n=dates.filter(d=>state.routines[d]?.[k]).length;return `<div class="barrow"><span>${k==='it'?'IT skills':'German'}</span><div class="progress"><i style="width:${n/7*100}%"></i></div><span>${n}/7</span></div>`}).join('')}<div class="notice">${logs.length}/7 daily check-ins · ${state.sessions.filter(x=>dates.includes(x.date)).reduce((a,x)=>a+x.minutes,0)} focused minutes<br>${state.projects.reduce((a,p)=>a+done(p),0)} project milestones completed overall</div><div class="sectionhead"><h2>Daily reflections</h2></div>${[...state.checkins].reverse().map(x=>`<div class="history"><small>${esc(x.date)} · Energy ${x.energy}/5 · ${x.outreach} outreach · Revenue ${esc(x.revenue)}</small><p><strong>Win:</strong> ${esc(x.win)}</p><p><strong>Obstacle:</strong> ${esc(x.blocker||'None recorded')}</p><p><strong>Next:</strong> ${esc(x.next)}</p></div>`).join('')||'<p class="empty">Your first check-in will appear here.</p>'}</div><div class="card"><h2>Weekly decisions</h2><p class="sub" style="font-size:12px;margin-top:10px">Review your offer, your routine, and your distractions before adding more work.</p>${[...state.reviews].reverse().map(x=>`<div class="history"><small>${esc(x.date)}</small><p>${esc(x.note)}</p></div>`).join('')||'<p class="empty">No weekly review yet.</p>'}<button data-weekly>＋ Weekly review</button></div></div>`}
function ideasView(){return intro('Ideas','Save ideas here. Review them after 14 days.',`<button class="primary" data-idea>＋ Capture idea</button>`)+`<div class="notice">Review your active project before starting another.</div><div class="stack" style="margin-top:20px">${[...state.ideas].reverse().map(x=>`<div class="card"><div class="projecttop"><h2>${esc(x.title)}</h2><span class="pill">${Date.now()-x.created>=14*86400000?'READY TO REVIEW':'COOLING OFF'}</span></div><p>${esc(x.note)}</p><small class="sub">Review after ${new Date(x.created+14*86400000).toLocaleDateString()}</small><button class="textbtn" style="float:right" data-deleteidea="${x.id}">Delete</button></div>`).join('')||'<div class="card empty">No saved ideas.</div>'}</div>`}
function checkin(){let x=state.checkins.find(x=>x.date===day())||{};modal({title:'Daily check-in',body:`<p class="sub">A two-minute check-in for ${day()}.</p><form id="check-form"><label class="field">What did you finish?<textarea name="win" required>${esc(x.win||'')}</textarea></label><label class="field">What got in the way?<textarea name="blocker">${esc(x.blocker||'')}</textarea></label><label class="field">One clear next action<input name="next" value="${esc(x.next||'')}" required></label><div class="formgrid"><label class="field">Energy · 1 to 5<input name="energy" type="number" min="1" max="5" value="${x.energy||3}" required></label><label class="field">Outreach messages sent<input name="outreach" type="number" min="0" value="${x.outreach||0}" required></label></div><label class="field">Revenue received · include currency<input name="revenue" placeholder="e.g. EUR 0" value="${esc(x.revenue||'')}" required></label><button class="primary">Save today’s check-in</button></form>`});$('#check-form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));state.checkins=state.checkins.filter(x=>x.date!==day());state.checkins.push({...data,date:day()});save();$('#modal').close();render();toast('Check-in saved. You have a clear next step.')}}
function captureIdea(){modal({title:'Park a new idea',body:'<form id="idea-form"><label class="field">Idea name<input name="title" required maxlength="120"></label><label class="field">Who does it help? Why would they pay?<textarea name="note" required></textarea></label><p class="notice">You can review this in 14 days. Your active project stays the same.</p><button class="primary">Save idea & return to focus</button></form>'});$('#idea-form').onsubmit=e=>{e.preventDefault();state.ideas.push({...Object.fromEntries(new FormData(e.target)),created:Date.now(),id:crypto.randomUUID()});save();$('#modal').close();render();toast('Idea safely parked.')}}
function focus(){modal({title:'Focus session',body:`<p class="sub">${esc(state.active)} · 25-minute focus session</p><div class="timer" id="clock"></div><div style="display:flex;justify-content:center;gap:10px"><button class="lime" id="timer-toggle">${running?'Pause':'Start'}</button><button id="timer-reset">Reset</button></div><p class="notice" style="margin-top:25px">Pick one outcome. Close the distractions. A completed session is recorded automatically. Keep this page open.</p>`});updateClock();$('#timer-toggle').onclick=()=>{if(running){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));running=false;clearInterval(timer)}else{endAt=Date.now()+remaining*1000;running=true;timer=setInterval(tick,500)}$('#timer-toggle').textContent=running?'Pause':'Resume'};$('#timer-reset').onclick=()=>{clearInterval(timer);running=false;remaining=1500;updateClock();$('#timer-toggle').textContent='Start'}}
function updateClock(){if($('#clock'))$('#clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function tick(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));updateClock();if(!remaining){clearInterval(timer);running=false;state.sessions.push({date:day(),minutes:25,project:state.active});save();remaining=1500;if($('#timer-toggle'))$('#timer-toggle').textContent='Start again';render();toast('25 focused minutes completed and recorded.')}}
function bind(){document.querySelectorAll('[data-client-add]').forEach(b=>b.onclick=()=>clientForm());document.querySelectorAll('[data-client-edit]').forEach(b=>b.onclick=()=>clientForm(b.dataset.clientEdit));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{selected=b.dataset.project;page='Projects';render()});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{state.done[b.dataset.task]=b.checked;save();render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=getPlan();if(p.includes(b.dataset.add))return toast('Already in today’s plan.');if(p.length>=3)return toast('Your day has three commitments. Remove one before adding more.');state.plan[day()]=[...p,b.dataset.add];save();render();toast('Added to today’s commitments.')});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.plan[day()]=getPlan().filter(k=>k!==b.dataset.remove);save();render()});document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>{modal({title:'Choose a deliberate priority',body:`<p>Make <strong>${esc(b.dataset.activate)}</strong> your active business? ${esc(state.active)} will be parked. Your existing tasks stay saved.</p><button class="primary" id="confirm-priority">Switch priority</button>`});$('#confirm-priority').onclick=()=>{state.active=b.dataset.activate;save();$('#modal').close();render()}});document.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>logRoutine(b.dataset.routine));document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=checkin);document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=captureIdea);document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=focus);document.querySelectorAll('[data-weekly]').forEach(b=>b.onclick=weekly);document.querySelectorAll('[data-deleteidea]').forEach(b=>b.onclick=()=>{state.ideas=state.ideas.filter(x=>x.id!==b.dataset.deleteidea);save();render()});document.querySelectorAll('[data-obstacle]').forEach(b=>b.onclick=()=>editText('Update project obstacle',project(b.dataset.obstacle).obstacle,value=>{project(b.dataset.obstacle).obstacle=value}));document.querySelectorAll('[data-newtask]').forEach(b=>b.onclick=()=>editText('Add a concrete milestone','',value=>project(b.dataset.newtask).tasks.push(value)));let f=$('#routine-settings');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.german=Number(d.get('german'));state.it=Number(d.get('it'));save();render();toast('Daily targets updated.')}}
function editText(title,value,apply){modal({title,body:`<form id="text-form"><label class="field">Details<textarea name="value" required maxlength="1000">${esc(value)}</textarea></label><button class="primary">Save</button></form>`});$('#text-form').onsubmit=e=>{e.preventDefault();apply(new FormData(e.target).get('value').trim());save();$('#modal').close();render()}}
function weekly(){editText('Weekly review','What moved forward? What distracted me? What will I change next week?',value=>state.reviews.push({date:day(),note:value}))}
function logRoutine(k){let x=state.routines[day()]?.[k]||{};modal({title:k==='german'?'Log German practice':'Log IT practice',body:`<form id="log-form"><label class="field">Minutes practiced<input name="minutes" type="number" min="1" max="1440" required value="${x.minutes||state[k]}"></label><label class="field">What did you learn or produce?<textarea name="note" required>${esc(x.note||'')}</textarea></label><button class="primary">Save practice</button></form>`});$('#log-form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.routines[day()]||={};state.routines[day()][k]={minutes:Number(d.minutes),note:d.note};save();$('#modal').close();render();toast('Practice recorded. Keep showing up.')}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='focus-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function settings(){modal({title:'Your data & workspace',body:'<p class="notice">This version stores data only in this browser. Clearing site data removes it. Export regular backups. There are no background notifications, cloud sync, subscriptions, or multi-user accounts in this version.</p><button id="backup-modal">Export backup</button><label class="field">Restore a Focus backup<input type="file" id="restore" accept="application/json"></label><p class="sub" style="font-size:12px">Restoring replaces this browser’s current workspace.</p><div id="restore-confirm"></div>'});$('#backup-modal').onclick=exportData;$('#restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());validateBackup(v);$('#restore-confirm').innerHTML='<button class="primary" id="restore-yes">Replace workspace with this backup</button>';$('#restore-yes').onclick=()=>{state=v;state.clients ||= [];save();$('#modal').close();render();toast('Backup restored.')}}catch{$('#restore-confirm').textContent='This is not a valid Focus backup.'}}}
function validateBackup(v){if((v.clients!==undefined&&(!Array.isArray(v.clients)||!v.clients.every(c=>c&&typeof c.id==='string'&&typeof c.client==='string'&&typeof c.name==='string'&&typeof c.tasks==='string'&&typeof c.amount==='number'&&Number.isFinite(c.amount)&&c.amount>=0&&typeof c.currency==='string'&&typeof c.due==='string'&&typeof c.payDue==='string'&&typeof c.status==='string'&&typeof c.payment==='string')))||v.version!==1||!Array.isArray(v.projects)||v.projects.length!==4||!seed.projects.every(p=>v.projects.some(q=>q.name===p.name&&typeof q.desc==='string'&&typeof q.obstacle==='string'&&Array.isArray(q.tasks)&&q.tasks.every(t=>typeof t==='string')))||!v.projects.some(p=>p.name===v.active))throw Error();for(let k of ['plan','done','routines'])if(!v[k]||typeof v[k]!=='object'||Array.isArray(v[k]))throw Error();for(let k of ['ideas','sessions','reviews','checkins'])if(!Array.isArray(v[k]))throw Error();if(!Object.values(v.plan).every(p=>Array.isArray(p)&&p.length<=3&&p.every(k=>{if(typeof k!=='string')return false;let [n,i]=k.split('::');return v.projects.some(p=>p.name===n&&Number.isInteger(Number(i))&&Number(i)>=0&&Number(i)<p.tasks.length)})))throw Error();if(!['german','it'].every(k=>Number.isFinite(v[k])&&v[k]>=5&&v[k]<=480))throw Error()}

function clientAlert(){let late=state.clients.filter(c=>c.status!=='Delivered'&&c.due&&c.due<day()).length,unpaid=state.clients.filter(c=>c.payment!=='Paid'&&c.amount>0).length;return state.clients.length?`<div class="notice" style="margin-bottom:20px">Client work: ${late} overdue ${late===1?'deadline':'deadlines'} · ${unpaid} unpaid ${unpaid===1?'invoice':'invoices'} <button class="textbtn" data-nav="Clients">Review →</button></div>`:''}
function clientsView(){let list=[...state.clients].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return intro('Client work','Track delivery, follow-ups, and payments.', '<button class="primary" data-client-add>＋ Client project</button>')+`<div class="notice">Payment records are manual. Focus does not send invoices, collect payments, or notify clients.</div><div class="projectgrid" style="margin-top:20px">${list.map(c=>{let late=c.status!=='Delivered'&&c.due&&c.due<day(),paylate=c.payment!=='Paid'&&c.payDue&&c.payDue<day();return `<article class="card"><div class="projecttop"><h2>${esc(c.name)}</h2><span class="pill">${esc(c.status)}</span></div><p class="sub">${esc(c.client)}</p><p style="margin-top:15px"><strong>Delivery:</strong> ${esc(c.due||'Not set')}${late?' · Overdue':''}<br><strong>Payment:</strong> ${esc(c.currency)} ${Number(c.amount).toLocaleString()} · ${esc(c.payment)}<br><strong>Payment due:</strong> ${esc(c.payDue||'Not set')}${paylate?' · Overdue':''}</p><h3>Tasks & next steps</h3><p style="white-space:pre-line;font-size:13px;margin-top:10px">${esc(c.tasks||'No tasks recorded.')}</p>${c.notes?`<p class="notice" style="white-space:pre-line">${esc(c.notes)}</p>`:''}<button data-client-edit="${esc(c.id)}">Update project</button></article>`}).join('')||'<div class="card empty" style="grid-column:1/-1">No client projects yet. Add one with a deadline and next task.</div>'}</div>`}
function clientForm(id){let c=state.clients.find(c=>c.id===id)||{client:'',name:'',due:'',payDue:'',amount:0,currency:'EUR',status:'In progress',payment:'Not invoiced',tasks:'',notes:''};modal({title:id?'Update client project':'New client project',body:`<form id="client-form"><label class="field">Client<input name="client" required maxlength="120" value="${esc(c.client)}"></label><label class="field">Project<input name="name" required maxlength="160" value="${esc(c.name)}"></label><div class="formgrid"><label class="field">Delivery deadline<input type="date" name="due" value="${esc(c.due)}"></label><label class="field">Status<select name="status">${['In progress','Waiting on client','Blocked','Delivered'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="field">Tasks & next steps · one per line<textarea name="tasks" maxlength="5000">${esc(c.tasks)}</textarea></label><div class="formgrid"><label class="field">Invoice amount<input type="number" min="0" max="999999999" step="0.01" name="amount" required value="${c.amount}"></label><label class="field">Currency<input name="currency" required maxlength="3" minlength="3" pattern="[A-Za-z]{3}" value="${esc(c.currency)}"></label></div><div class="formgrid"><label class="field">Payment due<input name="payDue" type="date" value="${esc(c.payDue)}"></label><label class="field">Payment status<select name="payment">${['Not invoiced','Awaiting payment','Paid'].map(x=>`<option ${c.payment===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="field">Notes · approvals, scope, follow-ups<textarea name="notes" maxlength="5000">${esc(c.notes||'')}</textarea></label><button class="primary">Save client project</button></form>`});$('#client-form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.amount=Number(v.amount);v.currency=v.currency.toUpperCase();v.id=id||crypto.randomUUID();if(id)state.clients=state.clients.map(x=>x.id===id?v:x);else state.clients.push(v);save();$('#modal').close();render();toast('Client project saved.')}}

$('#export').onclick=exportData;$('#checkin').onclick=checkin;$('#settings').onclick=settings;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});render();

</script></body></html>
